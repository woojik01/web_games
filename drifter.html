<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d120e">
<title>떠돌이 · DRIFTER</title>
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
:root{
  --panel:#141b14; --panel2:#1a2318; --line:#3d4a39; --line2:#5f7052;
  --tx:#e8e2cf; --dim:#96a188; --amber:#d8a03c; --amber2:#f0c468;
  --red:#c8564a; --green:#7fae5c;
  --px:'Galmuri11','Galmuri9',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d0a;font-family:var(--px);color:var(--tx);
  user-select:none;-webkit-user-select:none;touch-action:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center,transparent 48%,rgba(7,11,8,.62) 100%)}
#dmgflash{position:fixed;inset:0;pointer-events:none;z-index:3;background:rgba(190,60,45,.28);opacity:0;transition:opacity .35s}
#warpfade{position:fixed;inset:0;pointer-events:none;z-index:41;background:rgba(240,196,104,.4);opacity:0;transition:opacity .45s}
#deathfade{position:fixed;inset:0;pointer-events:none;z-index:60;background:#060806;opacity:0;transition:opacity 1.2s}

#rotate{position:fixed;inset:0;z-index:200;background:#0a0d0a;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--dim);text-align:center;padding:20px}
@media (orientation:portrait){body.coarse #rotate{display:flex}}
#rotate svg{animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}

#pad{position:fixed;inset:0;z-index:4}
#joyBase,#joyStick{position:fixed;z-index:5;pointer-events:none;display:none;border-radius:50%}
#joyBase{width:104px;height:104px;border:2px solid rgba(232,226,207,.28);background:rgba(20,27,20,.25)}
#joyStick{width:40px;height:40px;background:rgba(232,226,207,.35);border:2px solid rgba(232,226,207,.5)}

#ui{position:fixed;inset:0;z-index:10;pointer-events:none;font-size:11px;line-height:1.5}
#ui .panel{background:rgba(18,24,17,.92);border:1px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.45)}
#ui button{pointer-events:auto;font-family:var(--px);font-size:11px;color:var(--tx);
  background:var(--panel2);border:1px solid var(--line2);padding:6px 10px;cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.5)}
#ui button:active{transform:translateY(2px);box-shadow:none}
#ui button.acc{background:var(--amber);border-color:var(--amber2);color:#231a08}
#ui button.warn{background:#4a2b24;border-color:#8a5148}
#ui button:disabled{opacity:.4;cursor:default}

#topleft{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
#mmWrap{padding:5px;cursor:zoom-in;pointer-events:auto}
#mm{display:block;width:132px;height:132px;background:#0a0e0a}
.bar{width:132px;height:9px;background:#0c100c;border:1px solid var(--line);position:relative}
.bar>i{display:block;height:100%}
#hpF{background:var(--red)}#stF{background:var(--amber)}
.bar.low>i{animation:blinkbar .5s steps(2) infinite}
@keyframes blinkbar{50%{filter:brightness(.5)}}
#lvRow{width:132px;display:flex;justify-content:space-between;color:var(--dim)}
#xpBar{width:132px;height:4px;background:#0c100c;border:1px solid var(--line)}
#xpF{display:block;height:100%;background:var(--green)}
#resRow{display:flex;flex-wrap:wrap;gap:4px 8px;padding:5px 7px;width:132px}
.res{display:flex;align-items:center;gap:3px}
.res canvas{width:16px;height:16px}
.res b{font-weight:normal;color:var(--tx);font-size:10px}
.res span{color:var(--dim);font-size:9px}
#slotRow{display:flex;gap:5px;pointer-events:auto}
.slot{width:46px;height:46px;background:rgba(18,24,17,.9);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.slot canvas{width:32px;height:32px}
.slot .empty{width:8px;height:8px;background:#2a3527}
.slot.sel{animation:selpulse .7s steps(2) infinite;border-color:var(--amber2)}
@keyframes selpulse{50%{background:#3a3020}}
#statSum{padding:3px 6px;color:var(--dim);font-size:10px;width:132px;line-height:1.5;word-break:keep-all}

#sysBtns{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
  display:flex;gap:5px}
#sysBtns button{padding:4px 7px;font-size:11px;display:flex;align-items:center;justify-content:center;min-width:28px;min-height:26px}

#panel{position:absolute;top:calc(52px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
  bottom:calc(10px + env(safe-area-inset-bottom));width:308px;max-width:calc(100vw - 20px);
  display:none;flex-direction:column;pointer-events:auto}
#panel.show{display:flex}
#panelTabs{display:flex;gap:5px;padding:8px 8px 0;align-items:center}
.ptab{flex:1}
.ptab.on{background:var(--amber);border-color:var(--amber2);color:#231a08}
#panelClose{padding:4px 10px}
#panelBody{overflow-y:auto;padding:10px;flex:1;touch-action:pan-y}
.sectbtn{color:var(--dim);font-size:10px;margin:10px 0 5px;border-bottom:1px solid var(--line);
  padding-bottom:3px;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.sectbtn:first-child{margin-top:0}
.sectbtn span:last-child{color:var(--amber2)}
.prow{display:flex;gap:8px;padding:6px;border:1px solid var(--line);background:rgba(24,32,23,.6);
  margin-bottom:6px;align-items:center}
.prow.sel{border-color:var(--amber2);animation:selpulse .7s steps(2) infinite;cursor:pointer}
.prow.rep{border-color:var(--amber2);cursor:pointer}
.pico{width:34px;height:34px;background:#0d120e;border:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center}
.pico canvas{width:26px;height:26px}
.pmain{flex:1;min-width:0}
.pname{color:var(--amber2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .psub{color:var(--dim);font-size:10px}
.pstats{font-size:10px;color:#a9c7a0;line-height:1.45;word-break:keep-all}
.pstats .base{color:var(--tx)}
.pstats .none{color:#5c6a54}
.pempty{color:#5c6a54;font-size:11px;padding:6px 2px}
.pbtns{display:flex;flex-direction:column;gap:4px;flex:none}
.pbtns button{padding:4px 8px;font-size:10px}
.repbar{display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:#3a3020;border:1px solid var(--amber2);color:var(--amber2);padding:5px 8px;margin-bottom:6px;font-size:10px}
.repbar.confirm{background:#2a2418}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--tx);
  background:#0d120e;border:1px solid var(--line);padding:1px 4px;margin:1px 3px 1px 0}
.chip canvas{width:13px;height:13px}
.chip.no{color:var(--red)}
.baseSel{display:flex;flex-wrap:wrap;gap:4px}
.bsel{width:36px;height:36px;background:#0d120e;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;min-height:0}
.bsel canvas{width:26px;height:26px}
.bsel.on{border-color:var(--amber2);background:#3a3020}
.rrow{display:flex;gap:8px;padding:6px;border:1px solid var(--line);background:rgba(24,32,23,.6);margin-bottom:6px;align-items:center}
.rdesc{color:var(--dim);font-size:10px}
body.coarse #panel{top:calc(42px + env(safe-area-inset-top));bottom:calc(154px + env(safe-area-inset-bottom));
  width:min(268px,56vw)}

#quickbar{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:6px;pointer-events:auto}
.qbtn{width:46px;height:46px;position:relative;display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(18,24,17,.9);border:1px solid var(--line2);cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.5);font-family:var(--px)}
.qbtn:active{transform:translateY(2px);box-shadow:none}
.qbtn canvas{width:22px;height:22px}
.qbtn b{position:absolute;right:3px;bottom:2px;font-size:10px;color:var(--amber2);font-weight:normal}
.qbtn.off{opacity:.35}
body.coarse #quickbar{left:auto;right:calc(16px + env(safe-area-inset-right));bottom:calc(232px + env(safe-area-inset-bottom))}
body.coarse .qbtn{width:40px;height:40px}
body.coarse .qbtn canvas{width:18px;height:18px}
#panel.show + #quickbar{display:none}

#pickupHint{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom));padding:5px 12px;display:none;color:var(--amber2);pointer-events:none}
body.coarse #pickupHint{bottom:calc(288px + env(safe-area-inset-bottom))}
#hintBar{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  padding:6px 12px;color:var(--dim);white-space:nowrap;display:none;transition:opacity 1s}
body.coarse #hintBar{bottom:calc(322px + env(safe-area-inset-bottom))}
#toasts{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  align-items:center;gap:5px;pointer-events:none}
.toast{padding:6px 14px;background:rgba(18,24,17,.92);border:1px solid var(--line);color:var(--amber2);
  animation:toastin .2s steps(3)}
.toast.small{color:var(--dim)}
@keyframes toastin{from{transform:translateY(-8px);opacity:0}}

/* 대화창 */
#dlg{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(22px + env(safe-area-inset-bottom));width:430px;max-width:calc(100vw - 20px);
  padding:12px;pointer-events:auto;display:none;
  max-height:calc(100vh - 150px);overflow-y:auto;touch-action:pan-y}
#dlg.show{display:block}
body.coarse #dlg{bottom:calc(160px + env(safe-area-inset-bottom));max-height:calc(100vh - 180px)}
.dlgName{color:var(--amber);font-size:12px;margin-bottom:5px}
.dlgText{min-height:44px;font-size:12px;color:var(--tx)}
.dlgShop{margin-top:4px;max-height:40vh;overflow-y:auto;touch-action:pan-y}
.dlgShop .sectbtn{position:sticky;top:0;z-index:1;background:rgba(18,24,17,.96);
  margin:0 0 5px;padding:4px 0 5px}
.dlgShop .sectbtn button{padding:3px 10px;font-size:10px}
body.coarse .dlgShop{max-height:34vh}
body.coarse .dlgShop .rrow{padding:3px;gap:5px;margin-bottom:4px}
body.coarse .dlgShop .pico{width:24px;height:24px}
body.coarse .dlgShop .pico canvas{width:18px;height:18px}
body.coarse .dlgShop .pbtns button{padding:3px 6px;font-size:9px}
.dlgNext{margin-top:7px;color:var(--amber2);font-size:11px;display:none;animation:blinkbar 1s steps(2) infinite}
.dlgBtns{margin-top:8px;display:flex;gap:6px}

#ctrl{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
body.coarse #ctrl{display:block}
.cbtn{position:fixed;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--tx);background:rgba(24,32,23,.72);border:2px solid var(--line2);
  box-shadow:0 3px 0 rgba(0,0,0,.5)}
.cbtn:active,.cbtn.on{background:rgba(70,88,60,.8);transform:translateY(2px);box-shadow:none}
#btnAtk{right:calc(16px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));width:74px;height:74px;border-color:var(--amber);font-size:12px}
#btnRun{right:calc(100px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:56px;height:56px}
#btnUse{right:calc(18px + env(safe-area-inset-right));bottom:calc(166px + env(safe-area-inset-bottom));width:52px;height:52px}
#btnUse.hot{border-color:var(--amber2);background:rgba(90,74,34,.85);animation:selpulse .9s steps(2) infinite}

/* 튜토리얼 UI */
#tutOv{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;
 background:rgba(5,8,5,.72)}
#tutOv.show{display:flex}
#tutBox{width:440px;max-width:calc(100vw - 24px);max-height:calc(100vh - 40px);overflow-y:auto;
  padding:22px 26px;pointer-events:auto;text-align:left;
  background:rgba(18,24,17,.97);border:1px solid var(--line2);box-shadow:0 4px 0 rgba(0,0,0,.5);touch-action:pan-y}
#tutBox h2{color:var(--amber2);font-size:17px;margin-bottom:4px;letter-spacing:1px}
#tutBox .tutSpeaker{color:var(--amber);font-size:11px;margin-bottom:8px}
#tutBox p{font-size:12px;color:var(--tx);line-height:1.7;margin-bottom:8px;word-break:keep-all}
#tutBox .tutHintLine{font-size:10px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
#tutBox .tutRow{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;align-items:center}
#tutBox button{font-family:var(--px);font-size:12px;color:var(--tx);pointer-events:auto;
  background:var(--panel2);border:1px solid var(--line2);padding:8px 16px;cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.5)}
#tutBox button.acc{background:var(--amber);border-color:var(--amber2);color:#231a08}
#tutBox button.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--dim);font-size:10px;padding:8px 6px}
#tutBox button:active{transform:translateY(2px);box-shadow:none}

#tutSteps{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:none;flex-direction:column;align-items:center;gap:3px;pointer-events:none;z-index:12}
#tutSteps.show{display:flex}
#tutStepsTitle{font-size:10px;color:var(--dim)}
#tutStepsList{display:flex;gap:4px;padding:5px 8px;background:rgba(18,24,17,.88);border:1px solid var(--line)}
.tstep{width:9px;height:9px;background:#2a3527;border:1px solid var(--line)}
.tstep.done{background:var(--green);border-color:var(--green)}
.tstep.cur{background:transparent;border-color:var(--amber2);animation:selpulse .8s steps(2) infinite}
body.coarse #tutSteps{top:calc(40px + env(safe-area-inset-top))}

#tutMsg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  max-width:88vw;padding:10px 18px;pointer-events:none;z-index:12;
  color:var(--amber2);font-size:13px;text-align:center;display:none;
  background:rgba(13,18,13,.88);border:1px solid var(--amber);box-shadow:0 3px 0 rgba(0,0,0,.5)}
#tutMsg.show{display:block}
body.coarse #tutMsg{top:30%}

#mapOv{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;
  background:rgba(7,11,8,.9)}
#mapOv.show{display:flex}
#mapOv button{pointer-events:auto;font-family:var(--px);font-size:12px;color:var(--tx);
  background:var(--panel2);border:1px solid var(--line2);padding:6px 12px;cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.5)}
#mapOv button:active{transform:translateY(2px);box-shadow:none}
#mapOv button.acc{background:var(--amber);border-color:var(--amber2);color:#231a08}
#mapTop{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
#mapTitle{color:var(--amber2);font-size:14px;flex:1}
#mapZoom{display:flex;gap:6px;align-items:center}
#mapZoomLv{color:var(--dim);font-size:11px;min-width:36px;text-align:center}
#bigmap{flex:1;min-height:0;width:100%;touch-action:none;cursor:grab;background:#0a0e0a}
#mapLegend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;
 padding:8px 14px calc(10px + env(safe-area-inset-bottom));color:var(--dim);font-size:10px;border-top:1px solid var(--line)}
#mapLegend .li{display:flex;align-items:center;gap:5px}
#mapLegend i{width:8px;height:8px;flex:none}
#mapLegend .st{margin-left:auto;color:var(--amber2)}

#pauseOv{position:fixed;inset:0;z-index:48;display:none;align-items:center;justify-content:center;
  background:rgba(5,8,5,.62)}
#pauseOv.show{display:flex}
#pauseBox{padding:24px 32px;text-align:center;pointer-events:auto;
  background:rgba(18,24,17,.95);border:1px solid var(--line2);box-shadow:0 4px 0 rgba(0,0,0,.5)}
#pauseBox h2{color:var(--amber2);font-size:18px;margin-bottom:6px}
#pauseStats{color:var(--tx);font-size:12px;margin-bottom:4px}
#pauseStats .sub{color:var(--dim);font-size:10px}
#pauseHint{color:var(--dim);font-size:10px;margin-bottom:16px}
#pauseBox .row{display:flex;gap:8px;justify-content:center}
#pauseBox button{font-family:var(--px);font-size:12px;color:var(--tx);
  background:var(--panel2);border:1px solid var(--line2);padding:8px 16px;cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.5)}
#pauseBox button.acc{background:var(--amber);border-color:var(--amber2);color:#231a08}
#pauseBox button:active{transform:translateY(2px);box-shadow:none}

#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,12,9,.55);transition:opacity .8s}
#title.hide{opacity:0;pointer-events:none}
#titleBox{text-align:center;padding:26px 34px;background:rgba(13,18,13,.85);border:1px solid var(--line);
  box-shadow:0 4px 0 rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
#logoRow{display:flex;align-items:center;gap:16px;justify-content:center}
#logoRow canvas{width:64px;height:64px}
#gameTitle{font-size:42px;color:var(--amber2);letter-spacing:2px}
#subtitle{color:var(--dim);margin:8px 0 18px;font-size:12px}
#titleBtns{display:flex;flex-direction:column;gap:8px;align-items:center}
#titleBtns button{min-width:220px;font-size:13px;padding:9px 0}
#confirmNew{display:none;color:var(--dim);font-size:11px;gap:6px;align-items:center;justify-content:center}
#confirmNew.show{display:flex}
#titleFoot{margin-top:16px;color:#68755f;font-size:10px}
#titleLangs{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}

#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,8,5,.7)}
#modal.show{display:flex}
#modalBox{width:470px;max-width:calc(100vw - 24px);max-height:calc(100vh - 40px);overflow-y:auto;
  padding:16px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 4px 0 rgba(0,0,0,.5);touch-action:pan-y}
#modalBox h2{color:var(--amber2);font-size:15px;margin-bottom:10px}
#modalBox h3{color:var(--tx);font-size:12px;margin:10px 0 4px}
#modalBox p,#modalBox li{font-size:11px;color:var(--dim)}
#modalBox ul{list-style:none}
#modalBox li b{color:var(--tx);font-weight:normal}
#modalBox .row{display:flex;gap:6px;margin-top:14px;justify-content:flex-end}

body.coarse #mm{width:72px;height:72px}
body.coarse .bar{width:72px;height:7px}
body.coarse #lvRow{width:72px;font-size:9px}
body.coarse #xpBar{width:72px;height:3px}
body.coarse #topleft{gap:3px}
body.coarse #resRow,body.coarse #slotRow,body.coarse #statSum{display:none}
body.coarse #sysBtns button{padding:3px 5px;min-width:24px;min-height:22px}
body.coarse .ptab,body.coarse #panelClose{padding:4px 6px;font-size:10px}
body.coarse .prow{padding:4px;gap:6px}
body.coarse .pico{width:28px;height:28px}
body.coarse .pico canvas{width:22px;height:22px}
body.coarse .pbtns{gap:3px}
body.coarse .pbtns button{padding:3px 6px;font-size:9px}
body.coarse .pname{font-size:11px}
body.coarse .pstats{font-size:9px}
body.coarse .bsel{width:30px;height:30px}
body.coarse .bsel canvas{width:22px;height:22px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vignette"></div>
<div id="dmgflash"></div>
<div id="warpfade"></div>
<div id="pad"></div>
<div id="joyBase"></div><div id="joyStick"></div>

<div id="rotate">
 <svg width="56" height="56" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" fill="none" stroke="#d8a03c" stroke-width="2"/><circle cx="12" cy="18" r="1" fill="#d8a03c"/></svg>
 <div id="rotateTxt"></div>
</div>

<div id="ui">

let uid=0;
function rollOptions(rng,minOpts){
 const luck=(stats&&typeof stats.luck==='number'&&stats.luck)||0;
 let n=0;const r=rng(),sh=luck*0.006;
 if(r<0.06+sh*2)n=3;else if(r<0.28+sh)n=2;else if(r<0.60+sh*0.5)n=1;
 if(minOpts>=0)n=Math.max(n,minOpts);
 const pool=Object.keys(OPT_RANGE),opts=[];
 for(let i=0;i<n;i++){const k=pool[Math.floor(rng()*pool.length)];pool.splice(pool.indexOf(k),1);
  const[a,b]=OPT_RANGE[k];opts.push({k,v:a+Math.floor(rng()*(b-a+1))})}
 return opts}
function makeEquip(rng,minOpts=-1){
 const tot=BASE_W.reduce((s,e)=>s+e[1],0);let r=rng()*tot,base='pickaxe';
 for(const e of BASE_W){r-=e[1];if(r<=0){base=e[0];break}}
 return{base,opts:rollOptions(rng,minOpts),h1:Math.floor(rng()*1e9),h2:Math.floor(rng()*1e9),id:++uid}}
function makeEquipFixed(base,rng,minOpts=-1){
 return{base,opts:rollOptions(rng,minOpts),h1:Math.floor(rng()*1e9),h2:Math.floor(rng()*1e9),id:++uid}}

/* [핵심 수정] 매 프레임 평가 — 이전엔 달리기 체크가 '!tut.ran' 래치
   안에 갇혀 완료 검사가 단 한 프레임만 실행됐다.
   새 방식: 단계 시작 후 관측된 스테미너 '최고치'를 계속 갱신하다가,

function tutTrackMove(dt,moving){
 if(!tut.active)return;
 const k=tutCur();
 if(k==='move'||k==='far'){
  if(!moving)return;
  const d=Math.hypot(player.x-tut.lastX,player.y-tut.lastY);
  if(d>2){tut.walked+=d;tut.lastX=player.x;tut.lastY=player.y}
  if(tut.walked>60)tutStepDone(k)}
 else if(k==='run'){
  if(player.stam>tut.stamPeak)tut.stamPeak=player.stam;
  const need=clamp(stats.maxStam*0.2,12,30);
  if(tut.stamPeak-player.stam>=need)tutStepDone('run')}}

let actx=null, noiseBuf=null;
function ensureAudio(){try{
 if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=actx.createBuffer(1,actx.sampleRate*0.3,actx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 if(actx.state==='suspended')actx.resume();
}catch(e){}}
function tone(f0,f1,dur,type,vol,delay=0){if(!actx||muted)return;
 const t0=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
 g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.02)}
function noiseHit(dur,vol,freq,delay=0){if(!actx||muted)return;
 const t0=actx.currentTime+delay,s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
 s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;
 g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t0);s.stop(t0+dur+0.02)}
function sfx(n){switch(n){
 case 'swing':noiseHit(0.05,0.06,900);break;
 case 'chop':noiseHit(0.07,0.22,500);tone(180,120,0.06,'square',0.07);break;
 case 'break':noiseHit(0.22,0.3,300);tone(150,60,0.18,'square',0.09);break;
 case 'hit':tone(300,180,0.08,'square',0.12);noiseHit(0.05,0.12,700);break;
 case 'res':tone(600+Math.random()*90,880,0.09,'triangle',0.09);break;
 case 'equip':tone(660,660,0.05,'square',0.1);tone(990,990,0.06,'square',0.08,0.06);break;
 case 'drop':tone(440,330,0.08,'triangle',0.08);break;
 case 'hurt':tone(220,80,0.2,'sawtooth',0.16);noiseHit(0.12,0.14,400);break;
 case 'level':[523,659,784].forEach((f,i)=>tone(f,f,0.1,'square',0.09,i*0.09));break;
 case 'ui':tone(500,500,0.03,'square',0.05);break;
 case 'talk':tone(300,340,0.06,'triangle',0.08);break;
 case 'deny':tone(180,140,0.12,'square',0.09);break;
 case 'alert':tone(660,990,0.09,'triangle',0.07);break;
 case 'trade':tone(880,880,0.07,'triangle',0.1);tone(1320,1320,0.08,'triangle',0.09,0.08);break;
 case 'warp':tone(220,900,0.3,'triangle',0.12);tone(900,1400,0.25,'triangle',0.08,0.12);break;
 case 'cast':noiseHit(0.08,0.07,1400);tone(700,400,0.08,'triangle',0.05);break;
 case 'splash':noiseHit(0.14,0.2,650);tone(280,140,0.1,'triangle',0.07);break;
 case 'reel':tone(500,760,0.07,'square',0.08);tone(760,990,0.06,'square',0.06,0.06);break;
}}

const B_WATER=0,B_SAND=1,B_MEADOW=2,B_FOREST=3,B_ROCK=4,B_SHALLOW=5;
const BIOME_COL=['#3c6f86','#cbb37a','#6d9b52','#47713b','#7a746a','#7fb8c9'];
const BIOME_KEY={[B_MEADOW]:'bioMeadow',[B_FOREST]:'bioForest',[B_ROCK]:'bioRock',
 [B_SHALLOW]:'bioShallow',[B_SAND]:'bioSand'};
function elev(tx,ty){return vnoise(tx*0.045,ty*0.045,seed)*0.55+vnoise(tx*0.1,ty*0.1,seed+7)*0.3+vnoise(tx*0.24,ty*0.24,seed+13)*0.15}
function moist(tx,ty){return vnoise(tx*0.05+100,ty*0.05,seed+31)}
function biomeAt(tx,ty){
 if(tx>=13&&tx<=19&&ty>=13&&ty<=19)return B_MEADOW;
 const e=elev(tx,ty);
 if(e<0.30)return B_WATER;
 if(e<0.345)return B_SHALLOW;
 if(e<0.375)return B_SAND;
 if(e>0.70)return B_ROCK;
 return moist(tx,ty)>0.55?B_FOREST:B_MEADOW}

function tilePaint(c,lx,ly,wx,wy,b){
 const px=lx*TILE,py=ly*TILE,h=hash2(wx,wy,seed+55);
 if(b===B_MEADOW||b===B_FOREST){
  const base=b===B_FOREST?(h<0.5?'#699951':'#63914b'):(h<0.5?'#86b15e':'#7fa957');
  c.fillStyle=base;c.fillRect(px,py,TILE,TILE);
  c.fillStyle=b===B_FOREST?'#4f7c41':'#6f9a4d';
  const n=2+Math.floor(h*3);
  for(let i=0;i<n;i++){const hx=hash2(wx*7+i,wy*3,seed+9),hy=hash2(wx,wy*11+i,seed+19);
   c.fillRect(px+Math.floor(hx*14),py+Math.floor(hy*14),1,2)}
  if(b===B_MEADOW&&hash2(wx,wy,seed+77)<0.02){
   c.fillStyle=hash2(wx,wy,seed+78)<0.5?'#e8d8a3':'#d8a03c';
   c.fillRect(px+Math.floor(h*10)+2,py+Math.floor(hash2(wx,wy,seed+79)*10)+2,1,1)}
 }else if(b===B_WATER){
  c.fillStyle=h<0.5?'#4e94b5':'#488bad';c.fillRect(px,py,TILE,TILE);
  c.fillStyle='#3f7fa0';
  if(h<0.35)c.fillRect(px+2,py+Math.floor(h*20)%12,8,2);
 }else if(b===B_SHALLOW){
  c.fillStyle=h<0.5?'#7fc0d4':'#79bad0';c.fillRect(px,py,TILE,TILE);
  c.fillStyle='#a5d8e4';
  if(h<0.5)c.fillRect(px+2,py+Math.floor(h*20)%12,7,1);
 }else if(b===B_SAND){
  c.fillStyle=h<0.5?'#d6c084':'#cfb97c';c.fillRect(px,py,TILE,TILE);
  c.fillStyle='#bda76c';c.fillRect(px+Math.floor(h*13),py+Math.floor(hash2(wx,wy,seed+81)*13),2,1);
 }else{
  c.fillStyle=h<0.5?'#9a9184':'#938a7d';c.fillRect(px,py,TILE,TILE);
  c.fillStyle='#7c756a';
  for(let i=0;i<3;i++){const hx=hash2(wx*5+i,wy*7,seed+91),hy=hash2(wx*3,wy*9+i,seed+92);
   c.fillRect(px+Math.floor(hx*13),py+Math.floor(hy*13),2,2)}
 }}

function buildTerrain(ch){
 const cv=document.createElement('canvas');cv.width=CS;cv.height=CS;
 const c=cv.getContext('2d');
 for(let ly=0;ly<CH;ly++)for(let lx=0;lx<CH;lx++){
  const wx=ch.cx*CH+lx,wy=ch.cy*CH+ly;
  tilePaint(c,lx,ly,wx,wy,ch.biome[ly*CH+lx])}
 return cv}

function getChunk(cx,cy){
 const key=cx+','+cy;let ch=chunks.get(key);
 if(ch)return ch;
 ch={cx,cy,key,biome:new Array(CH*CH),nodes:[],enemies:[],npc:null,loots:[],water:[],mapColor:2};
 chunks.set(key,ch);
 for(let ty=0;ty<CH;ty++)for(let tx=0;tx<CH;tx++){
  const b=biomeAt(cx*CH+tx,cy*CH+ty);ch.biome[ty*CH+tx]=b;
  if(b===B_WATER)ch.water.push([cx*CH+tx,cy*CH+ty]);
  if(tx>=13&&tx<=19&&ty>=13&&ty<=19&&cx===0&&cy===0)continue;
  const r=hash2(cx*CH+tx,cy*CH+ty,seed+101);
  let type=null;
  if(b===B_FOREST){if(r<0.10)type='tree';else if(r<0.125)type='bush'}
  else if(b===B_MEADOW){if(r<0.015)type='tree';else if(r<0.045)type='bush';else if(r<0.047)type='crystal'}
  else if(b===B_ROCK){if(r<0.055)type='rock';else if(r<0.085)type='iron';else if(r<0.090)type='crystal';else if(r<0.097)type='cave'}
  if(type){
   const info=NODE_INFO[type];
   const ox=(hash2(cx*CH+tx,cy*CH+ty,seed+113)-0.5)*10,oy=(hash2(cx*CH+tx,cy*CH+ty,seed+127)-0.5)*10;
   ch.nodes.push({idx:ch.nodes.length,type,x:(cx*CH+tx)*TILE+TILE/2+ox,y:(cy*CH+ty)*TILE+TILE/2+oy,
    hp:info.hp,maxHp:info.hp,shake:0,dead:false,looted:false,chunkKey:key,isNode:true});
  }}
 if(hash2(cx,cy,seed+701)<0.12&&!(cx===0&&cy===0)){
  const rr=chunkRng(cx,cy,702);
  let rx,ry,ok=false;
  for(let a=0;a<8&&!ok;a++){
   rx=(cx*CH+Math.floor(rr()*CH))*TILE+8;ry=(cy*CH+Math.floor(rr()*CH))*TILE+8;
   if(biomeAt(Math.floor(rx/TILE),Math.floor(ry/TILE))!==B_WATER)ok=true}
  if(ok)ch.nodes.push({idx:ch.nodes.length,type:'ruin',x:rx,y:ry,
   hp:1,maxHp:1,shake:0,dead:false,looted:false,chunkKey:key,isNode:true})}
 const caves=ch.nodes.filter(n=>n.type==='cave');
 if(caves.length)ch.nodes=ch.nodes.filter(n=>{
  if(n.type==='cave')return true;
  for(const cv of caves){const dx=n.x-cv.x,dy=n.y-cv.y;
   if(dx*dx+dy*dy<52*52)return false}
  return true});
 const des=destroyed[key];if(des)for(const i of des){if(ch.nodes[i])ch.nodes[i].dead=true}
 for(const n of ch.nodes){
  if(n.type==='cave'&&caveLooted.has(key+':'+n.idx))n.looted=true;
  if(n.type==='ruin'&&ruinDone.has(key+':'+n.idx))n.looted=true}
 const rng=chunkRng(cx,cy,555);
 if(hash2(cx,cy,seed+301)<0.13){
  const idx=Math.floor(rng()*999);
  const eq=makeEquip(rng);
  const lx=campSafeLootPos(cx,cy,rng);
  ch.loots.push(idx);
  if(!(looted[key]&&looted[key].includes(idx)))
   groundEquip.push({eq,x:lx[0],y:lx[1],ttl:null,ck:key,idx,uid:++uid,spawnT:gameT});
 }
 const er=hash2(cx,cy,seed+401);
 let ec=(cx===0&&cy===0)?0:(er<0.25?1:(er<0.33?2:0));
 const center=ch.biome[CH*CH/2+CH/2];
 for(let i=0;i<ec;i++){
  const r2=chunkRng(cx,cy,402+i);
  const k2=r2();let kind='slime';
  if(center===B_ROCK)kind=k2<0.4?'golem':(k2<0.7?'bat':'wolf');
  else if(center===B_FOREST)kind=k2<0.4?'wolf':(k2<0.7?'spider':'slime');
  else if(center===B_MEADOW)kind=k2<0.85?'slime':'spider';
  const ex=(cx*CH+Math.floor(r2()*CH))*TILE+8,ey=(cy*CH+Math.floor(r2()*CH))*TILE+8;
  if(biomeAt(Math.floor(ex/TILE),Math.floor(ey/TILE))===B_WATER)continue;
  const info=ENEMY_INFO[kind];
  ch.enemies.push({type:kind,x:ex,y:ey,hp:info.hp,maxHp:info.hp,anim:Math.random()*10,
   wdir:rand(0,6.28),wt:rand(1,4),kx:0,ky:0,flash:0,fx:1,alert:0,aggroed:false,isEnemy:true,_u:0});
 }
 if(hash2(cx,cy,seed+501)<0.17&&!(cx===0&&cy===0)){
  const r3=chunkRng(cx,cy,502);
  const isTrader=r3()<0.32;
  let nx,ny,ok=false;
  for(let a=0;a<6&&!ok;a++){
   nx=(cx*CH+Math.floor(r3()*CH))*TILE+8;ny=(cy*CH+Math.floor(r3()*CH))*TILE+8;
   if(biomeAt(Math.floor(nx/TILE),Math.floor(ny/TILE))!==B_WATER)ok=true}
  if(ok){
   const persona=isTrader?'trader':'wanderer';
   ch.npc={persona,x:nx,y:ny,id:key+':n',anim:Math.random()*10,bob:0};
  }}
 ch.mapColor=(center>=0&&center<=5)?center:2;
 return ch}
function campSafeLootPos(cx,cy,rng){
 for(let a=0;a<8;a++){
  const x=(cx*CH+Math.floor(rng()*CH))*TILE+8,y=(cy*CH+Math.floor(rng()*CH))*TILE+8;
  if(biomeAt(Math.floor(x/TILE),Math.floor(y/TILE))!==B_WATER)return[x,y]}
 return[cx*CS+CS/2,cy*CS+CS/2]}

function updateRadius(){return clamp(Math.ceil(innerWidth/SCALE/CS/2)+1,2,4)}
function nearChunkList(r){
 const out=[];const pcx=Math.floor(player.x/CS),pcy=Math.floor(player.y/CS);
 for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const c=chunks.get((pcx+i)+','+(pcy+j));if(c)out.push(c)}
 return out}
function activeNodes(){const r=updateRadius(),out=[];
 for(const c of nearChunkList(r))for(const n of c.nodes)if(!n.dead)out.push(n);return out}
function activeEnemies(){const r=updateRadius(),out=[];
 for(const c of nearChunkList(r))for(const e of c.enemies)out.push(e);return out}
function activeNpcs(){const out=[];for(const c of nearChunkList(1))if(c.npc)out.push(c.npc);return out}
function nearestEnterable(range){
 let best=null,bd=range;
 for(const n of nodeCache){
  if(!n.isNode||n.dead||n.looted)continue;
  if(n.type!=='cave'&&n.type!=='ruin')continue;
  const d=Math.hypot(n.x-player.x,n.y-player.y);
  if(d<bd){bd=d;best=n}}
 return best}
function nearestWarpRuin(range){
 let best=null,bd=range;
 for(const n of nodeCache){
  if(!n.isNode||n.type!=='ruin'||!n.looted)continue;
  const d=Math.hypot(n.x-player.x,n.y-player.y);
  if(d<bd){bd=d;best=n}}
 return best}
function findFishSpot(){
 let best=null,bd=46;
 const ptx=Math.floor(player.x/TILE),pty=Math.floor(player.y/TILE);
 for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
  const tx=ptx+dx,ty=pty+dy;
  if(biomeAt(tx,ty)!==B_WATER)continue;
  const wx=tx*TILE+TILE/2,wy=ty*TILE+TILE/2;
  const d=Math.hypot(wx-player.x,wy-player.y);
  if(d<bd){bd=d;best=[wx,wy]}}
 return best}

/* ---------- 충돌 ---------- */
function blockedAt(x,y){
 if(biomeAt(Math.floor((x-4)/TILE),Math.floor((y+5)/TILE))===B_WATER)return true;
 if(biomeAt(Math.floor((x+4)/TILE),Math.floor((y+5)/TILE))===B_WATER)return true;
 if(biomeAt(Math.floor(x/TILE),Math.floor((y+6)/TILE))===B_WATER)return true;
 for(const n of nodeCache){
  const r2=n.type==='tree'?42:(n.type==='cave'?144:100);
  const dx=x-n.x,dy=y-n.y;
  if(dx*dx+dy*dy<r2){
   const cdx=player.x-n.x,cdy=player.y-n.y;
   if(cdx*cdx+cdy*cdy<r2)continue;
   return true}}
 return false}
let nodeCache=[];
function tryMove(dx,dy){
 if(dx){const nx=player.x+dx;if(!blockedAt(nx,player.y))player.x=nx}
 if(dy){const ny=player.y+dy;if(!blockedAt(player.x,ny))player.y=ny}}

function recalcStats(){
 const s={atk:1,spd:0,vit:0,stam:0,regen:0,range:0,luck:0};
 for(const eq of player.equip){if(!eq)continue;
  const base=BASES[eq.base].stats;
  for(const k in base)s[k]+=base[k];
  for(const o of eq.opts)s[o.k]+=o.v}
 stats={...s,
  maxHp:30+s.vit+(player.lvl-1)*4, maxStam:100+s.stam+(player.lvl-1)*6,
  regen:12+s.regen+(player.lvl-1)*0.6, speed:70*(1+s.spd/100),
  atkRange:46+s.range, pickup:40+s.range, atk:Math.round(s.atk)};
 player.hp=Math.min(player.hp,stats.maxHp);

function findTarget(){
 const R=stats.atkRange;let best=null,bd=Infinity;
 for(const e of activeEnemies()){
  if(!e.isEnemy)continue;
  const einfo=ENEMY_INFO[e.type];if(!einfo)continue;
  const d=Math.hypot(e.x-player.x,e.y-player.y)-einfo.size-8;
  if(d<R&&d-40<bd){bd=d-40;best=e}}
 if(!best){for(const n of nodeCache){
  if(!n.isNode||n.type==='cave'||n.type==='ruin')continue;
  const info=NODE_INFO[n.type];if(!info)continue;
  const dx=n.x-player.x,dy=(n.y+info.hitY)-(player.y-6);
  const d=Math.hypot(dx,dy)-info.hitR;
  if(d<R&&d<bd){bd=d;best=n}}}
 return best}

 player.atkCool=0.45;attackT=0.18;sfx('swing');

 if(tg){
  const aimY=tg.isNode?tg.y-8:tg.y;
  attackDir=Math.atan2(aimY-(player.y-6),tg.x-player.x);
  player.face=tg.x<player.x?-1:1;
  attackWeapon= tg.isNode?firstIcon('pickaxe'):firstIcon('sword');
  if(tg.isNode)damageNode(tg,stats.atk);
  else damageEnemy(tg,stats.atk);
 }else{
  attackDir=player.face>0?0:Math.PI;attackWeapon=firstIcon('sword');
  let npc=null,bd=stats.atkRange+16;
  for(const n of activeNpcs()){const d=Math.hypot(n.x-player.x,n.y-player.y);if(d<bd){bd=d;npc=n}}
  if(npc&&gameT-lastNpcHintT>1.5){
   lastNpcHintT=gameT;
   floater(npc.x,npc.y-40,t('notEnemy'),'#e8e2cf');sfx('talk');return}
  const ent=nearestEnterable(stats.atkRange+24);
  if(ent&&gameT-lastCaveHintT>1.5){
   lastCaveHintT=gameT;
   floater(ent.x,ent.y-42,t(ent.type==='cave'?'notMine':'notInvest'),'#e8e2cf');sfx('talk')}}}

function rollFish(){
 const luck=(stats&&typeof stats.luck==='number'&&stats.luck)||0;
 let tot=0;const ws=[];
 for(const id in FISH_INFO){
  const f=FISH_INFO[id];
  let w=f.w;
  if(f.rare)w*=1+luck*0.05;
  ws.push([id,w]);tot+=w}
 let r=Math.random()*tot;
 for(const [id,w] of ws){r-=w;if(r<=0)return id}
 return 'minnow'}

function genQuest(exclude){
 const kinds=['gather','kill','ruin','cave','star','fish'].filter(k=>!exclude.includes(k));
 const k=choice(kinds.length?kinds:['gather','kill','ruin','cave','star','fish']);
 if(k==='gather')return{type:'gather',res:choice(['wood','stone','iron','crystal']),need:6+Math.floor(Math.random()*8),prog:0};
 if(k==='kill')return{type:'kill',mob:choice(['slime','wolf','spider','golem']),need:3+Math.floor(Math.random()*3),prog:0};
 if(k==='fish')return{type:'fish',need:2+Math.floor(Math.random()*3),prog:0};
 return{type:k,need:1,prog:0}}
function initQuests(){
 const qs=[],used=[];
 for(let i=0;i<3;i++){const q=genQuest(used);used.push(q.type);qs.push(q)}
 return qs}
function qDesc(q){
 switch(q.type){
  case 'gather':return t('qGather')(RES_META[q.res][LANG],q.need);
  case 'kill':return t('qKill')(MOB_META[q.mob][LANG],q.need);
  case 'ruin':return t('qRuin');
  case 'cave':return t('qCave');
  case 'fish':return t('qFish')(q.need);
  default:return t('qStar')}}
function questEvent(type,arg){
 let changed=false;
 for(const q of quests){
  if(q.done)continue;
  if(q.type!==type)continue;
  if(q.type==='gather'&&q.res!==arg)continue;
  if(q.type==='kill'&&q.mob!==arg)continue;
  q.prog++;changed=true;
  if(q.prog>=q.need){
   const xp=15+q.need*4;
   addXP(xp);player.res.crystal+=2;
   toast(t('qDone')(xp));sfx('level');
   const others=quests.filter(x=>x!==q).map(x=>x.type);
   const nq=genQuest(others);
   delete q.res;delete q.mob;
   q.type=nq.type;q.need=nq.need;q.prog=0;q.done=false;
   if(nq.res)q.res=nq.res;
   if(nq.mob)q.mob=nq.mob}}
 if(changed&&invOpen)renderPanel()}

function updateEnemies(dt){

  for(let i=c.enemies.length-1;i>=0;i--){

   const info=ENEMY_INFO[e.type];if(!info)continue;

   if(e.alert>0)e.alert-=dt;
   const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
   if(!e.aggroed&&info.aggro>0&&d<info.aggro){e.aggroed=true;e.alert=0.9;sfx('alert')}
   else if(e.aggroed&&d>info.aggro*1.8)e.aggroed=false;

   }else{

   const flies=e.type==='bat';
   const nx=e.x+(vx+e.kx)*dt,ny=e.y+(vy+e.ky)*dt;
   if(flies||biomeAt(Math.floor(nx/TILE),Math.floor(ny/TILE))!==B_WATER){e.x=nx;e.y=ny}
   else e.wdir=rand(0,6.28);
   e.kx*=Math.max(0,1-8*dt);e.ky*=Math.max(0,1-8*dt);
   if(d<info.size+10)damagePlayer(info.dmg,e.x,e.y);
   const ecx=Math.floor(e.x/CS),ecy=Math.floor(e.y/CS);

const pad=$('pad'),joyB=$('joyBase'),joyS=$('joyStick');
pad.addEventListener('pointerdown',e=>{
 if(e.pointerType!=='touch'||state!=='play')return;
 ensureAudio();
 if(invOpen)closeInv();
 if(fishing&&fishing.phase==='bite'){catchFish();return}
 if(joy.active)return;
 joy.active=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joy.dx=0;joy.dy=0;
 joyB.style.display='block';joyB.style.left=(e.clientX-52)+'px';joyB.style.top=(e.clientY-52)+'px';
 joyS.style.display='block';joyS.style.left=(e.clientX-20)+'px';joyS.style.top=(e.clientY-20)+'px';
 try{pad.setPointerCapture(e.pointerId)}catch(err){}});
pad.addEventListener('pointermove',e=>{
 if(!joy.active||e.pointerId!==joy.id)return;
 let dx=e.clientX-joy.bx,dy=e.clientY-joy.by;
 const l=Math.hypot(dx,dy);
 if(l>6){
  const oct=Math.round(Math.atan2(dy,dx)/(Math.PI/4));
  const qx=Math.round(Math.cos(oct*Math.PI/4)),qy=Math.round(Math.sin(oct*Math.PI/4));
  const diag=Math.abs(qx)&&Math.abs(qy);
  joy.dx=diag?qx*0.7071:qx;joy.dy=diag?qy*0.7071:qy}
 else{joy.dx=0;joy.dy=0}
 if(l>40){dx=dx/l*40;dy=dy/l*40}
 joyS.style.left=(joy.bx+dx-20)+'px';joyS.style.top=(joy.by+dy-20)+'px'});
function joyEnd(e){
 if(joy.active&&e.pointerId===joy.id){joy.active=false;joy.dx=0;joy.dy=0;
  joyB.style.display='none';joyS.style.display='none'}}

  starT=d.starT!=null?d.starT:70;

let wipeArmed=false, newMapArmed=false;
 function resetRuntimeToTitle(){
  state='title';paused=false;pauseOpen=false;invOpen=false;mapOpen=false;modalOpen=false;
  $('title').classList.remove('hide');$('confirmNew').classList.remove('show');
  $('modal').classList.remove('show');$('mapOv').classList.remove('show');$('pauseOv').classList.remove('show');

  seed=Math.floor(Math.random()*1e9)+1;uid=0;
  destroyed={};looted={};caveLooted=new Set();ruinDone=new Set();giftedSet=new Set();explored=new Map();
  landmarks=new Map();seenBiomes=new Set();farthest=0;quests=[];starActive=null;starT=70;
  Object.assign(player,{x:268,y:268,hp:30,stam:100,lvl:1,xp:0,invuln:0,dead:false,exhausted:false});
  player.res=defaultRes();player.pots={heal:0,tea:0};player.fish={};
  player.equip=[{base:'pickaxe',opts:[],h1:1,h2:2,id:++uid},null,null];
  chunks.clear();terrainLRU.clear();groundEquip=[];groundRes=[];particles=[];floaters=[];ambient=[];nearItems=[];nearSig='';prevNearUids=new Set();

 }
 $('btnWipe').onclick=()=>{

   setTimeout(()=>{newMapArmed=false;$('btnNewMap').textContent=t('newMap')},2500);return}

function initWorld(){
 chunks.clear();terrainLRU.clear();
 groundEquip=[];groundRes=[];particles=[];floaters=[];ambient=[];
 nearItems=[];nearSig='';prevNearUids=new Set();
 replaceState=null;fishing=null;
 closeInv();closeMap();togglePause(false);
 viewChunks();
 if(starActive){
  if(!landmarks.has('star'))landmarks.set('star',{t:'star',x:starActive.x,y:starActive.y});
  groundEquip.push({eq:starActive.eq,x:starActive.x,y:starActive.y,ttl:null,star:true,uid:++uid,spawnT:gameT})}
 cam.x=player.x;cam.y=player.y;
 const pcx=Math.floor(player.x/CS),pcy=Math.floor(player.y/CS);
 for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
  const key=(pcx+i)+','+(pcy+j);
  if(!explored.has(key)){const c=chunks.get(key);explored.set(key,(c&&c.mapColor!=null)?c.mapColor:2)}}
 recalcStats();renderRes();renderXP();renderQuickbar();drawMinimap()}
function startPlay(){
 state='play';paused=false;
 $('title').classList.add('hide');
 initWorld();
 requestFS();
 const hb=$('hintBar');
 hb.textContent=isCoarse()?t('hintMob'):t('hintDesk');
 hb.style.display='block';hb.style.opacity=1;
 setTimeout(()=>{hb.style.opacity=0;setTimeout(()=>hb.style.display='none',1100)},9000);

 $('btnNew').onclick=()=>{

 seed=Math.floor(Math.random()*1e9)+1;
 Object.assign(player,{x:268,y:268,hp:30,stam:100,lvl:1,xp:0,invuln:0,dead:false,exhausted:false});
 player.res=defaultRes();player.pots={heal:0,tea:0};player.fish={};
 player.equip=[{base:'pickaxe',opts:[],h1:1,h2:2,id:++uid},null,null];
 destroyed={};looted={};caveLooted=new Set();ruinDone=new Set();

 quests=initQuests();starActive=null;starT=rand(50,90);
 giftedSet=new Set();explored=new Map();

   메인 루프
   ================================================================ */
let last=0,titleT=0;
function frame(ts){
 const dt=Math.min(0.05,Math.max(0,(ts-last)/1000))||0.016;last=ts;
 if(state==='title'){
  try{titleUpdate(dt)}catch(err){console.error('[drifter] title:',err)}
 }else if(!paused){
  try{
   update(dt);
   mmTimer+=dt;if(mmTimer>0.25){mmTimer=0;drawMinimap()}
  }catch(err){console.error('[drifter] update:',err)}
 }
 try{render()}catch(err){console.error('[drifter] render:',err)}
 if(mapOpen){
  mapDrawT+=dt;
  if(mapDrawT>0.3){mapDrawT=0;
   try{sizeBigMap();drawBigMap()}catch(err){console.error('[drifter] map:',err)}}}
 requestAnimationFrame(frame)}
function titleUpdate(dt){
 titleT+=dt;
 cam.x=camp.x+Math.cos(titleT*0.07)*260;
 cam.y=camp.y+Math.sin(titleT*0.05)*180;
 gameT+=dt;
 if(Math.random()<dt*9)particles.push({x:camp.x+rand(-3,3),y:camp.y-8,vx:rand(-5,5),vy:rand(-38,-18),g:-30,life:rand(.3,.6),max:.6,size:rand(1.5,2.5),color:Math.random()<0.5?'#e8933c':'#f2c05a'});
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;
  if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt}}

(function boot(){
 try{
  const p=JSON.parse(localStorage.getItem(PREF_KEY));
  if(p&&p.lang){LANG=p.lang;muted=!!p.muted}
  else if(hasSave()){
   const d=JSON.parse(localStorage.getItem(SAVE_KEY));
   if(d&&d.lang)LANG=d.lang;
   if(d)muted=!!d.muted}
 }catch(e){}
 if(hasSave()){try{seed=JSON.parse(localStorage.getItem(SAVE_KEY)).seed}catch(e){seed=1}}
 else seed=Math.floor(Math.random()*1e9)+1;
 viewChunks();
 applyLang();
 injectIcons($('quickbar'));
 renderQuickbar();
 addEventListener('beforeunload',saveGame);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});
 requestAnimationFrame(frame)})();
