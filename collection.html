<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web game library</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: #333; margin-bottom: 10px; }
        #searchBar { width: 100%; max-width: 400px; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        #gameContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 800px; }
        .game-card { background: white; padding: 15px; text-align: center; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; cursor: pointer; text-decoration: none; color: #333; font-weight: bold; }
        .game-card:hover { transform: translateY(-5px); background-color: #eef2ff; color: #4f46e5; }
        .hidden { display: none; }

        /* PWA 설치 알림 배너 스타일 (제목 아래 고정) */
        #pwa-install-banner {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            color: #333;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #pwa-install-banner.hidden {
            display: none;
        }
        .banner-text {
            font-weight: 500;
        }
        .banner-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #install-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
        }
        #install-btn:hover {
            background-color: #4338ca;
        }
        #close-banner-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }
        #close-banner-btn:hover {
            color: #4b5563;
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(reg => console.log("Service Worker 등록:", reg.scope))
                    .catch(err => console.error("등록 실패:", err));
            });
        }
    </script>

    <h1>Web Game Library</h1>

    <div id="pwa-install-banner" class="hidden">
        <span class="banner-text">📱 앱으로 편하게 설치하기</span>
        <div class="banner-buttons">
            <button id="install-btn">설치</button>
            <button id="close-banner-btn" onclick="dismissBanner()">✕</button>
        </div>
    </div>

    <input type="text" id="searchBar" placeholder="게임 이름을 검색하세요..." onkeyup="filterGames()">

    <div id="gameContainer"></div>

    <script>
        // 1. 게임 데이터 설정 (영어이름: URL용, 한글이름: 표시용)
        const games = [
            { en: "backroom-mini", ko: "미니 백룸" },
            { en: "brick_breaking", ko: "벽돌깨기" },
            { en: "cutting_fruits", ko: "과일 자르기" },
            { en: "hell_survivor", ko: "미니 탕탕특공대" },
            { en: "immortal_wave", ko: "불멸의 웨이브" },
            { en: "pakur-side", ko: "옆으로 파쿠르" },
            { en: "pakur-up", ko: "위로 파쿠르" },
            { en: "receiving_fruits", ko: "과일 받기" },
            { en: "baduk", ko: "바둑" },
            { en: "omok", ko: "오목" }
        ];

        // 2. 영어 이름(en) 기준 알파벳 순 정렬
        games.sort((a, b) => a.en.toLowerCase().localeCompare(b.en.toLowerCase()));

        const container = document.getElementById('gameContainer');
        const baseUrl = "https://woojik01.github.io/web_games/";

        // 3. 게임 리스트 화면에 그리기
        function displayGames() {
            games.forEach(game => {
                const card = document.createElement('a');
                card.href = baseUrl + game.en;
                card.className = 'game-card';
                card.target = "_blank"; // 새 탭에서 열기
                card.innerHTML = `<div>${game.ko}</div>`;
                container.appendChild(card);
            });
        }

        // 4. 검색 기능
        function filterGames() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].innerText.toLowerCase();
                if (title.includes(query)) {
                    cards[i].classList.remove('hidden');
                } else {
                    cards[i].classList.add('hidden');
                }
            }
        }

        // 초기 실행
        displayGames();

        // --- PWA 설치 기능 스크립트 ---
        let deferredPrompt;
        const installBanner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('install-btn');

        // 브라우저가 PWA 설치 조건 충족 시 호출
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // 제목 아래에 배치된 배너가 드러납니다.
            installBanner.classList.remove('hidden');
        });

        // 설치 실행
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            
            deferredPrompt.prompt();
            
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            
            deferredPrompt = null;
            installBanner.classList.add('hidden');
        });

        // 닫기 버튼 누를 시 배너 숨김
        function dismissBanner() {
            installBanner.classList.add('hidden');
        }

        // 앱이 이미 설치되었을 때
        window.addEventListener('appinstalled', (evt) => {
            console.log('PWA가 성공적으로 설치되었습니다.');
            installBanner.classList.add('hidden');
        });
    </script>
</body>
</html>
