<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web game library</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: #333; margin-bottom: 10px; }
        #searchBar { width: 100%; max-width: 400px; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        #gameContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 800px; }
        .game-card { background: white; padding: 15px; text-align: center; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; cursor: pointer; text-decoration: none; color: #333; font-weight: bold; }
        .game-card:hover { transform: translateY(-5px); background-color: #eef2ff; color: #4f46e5; }
        .hidden { display: none !important; }

        /* PWA 설치 알림 배너 스타일 */
        #pwa-install-banner {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            color: #333;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .banner-text { font-weight: 500; }
        .banner-buttons { display: flex; align-items: center; gap: 8px; }
        #install-btn { background-color: #4f46e5; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; white-space: nowrap; }
        #install-btn:hover { background-color: #4338ca; }
        #close-banner-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 16px; padding: 4px; }
        #close-banner-btn:hover { color: #4b5563; }

        /* 3초 자동 로테이션 슬라이드 배너 스타일 */
        #auto-slider-container {
            width: 100%;
            max-width: 400px;
            height: 80px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            margin-bottom: 20px;
        }
        .slider-wrapper {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .slide {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            text-decoration: none;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            flex-shrink: 0; /* 슬라이드 크기 고정 */
        }
        /* 슬라이드 순서별 배경색 (필요 시 자유롭게 추가 가능) */
        .slide:nth-child(1) { background: linear-gradient(135deg, #ff7e5f, #feb47b); }
        .slide:nth-child(2) { background: linear-gradient(135deg, #6a11cb, #2575fc); }
        .slide:nth-child(3) { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .slide:nth-child(4) { background: linear-gradient(135deg, #ff0844, #ffb199); }

        .slide-title { font-size: 12px; opacity: 0.9; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .slide-desc { font-size: 16px; }

        /* 인디케이터 Dot 점 표시 */
        .dots-container {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .dot.active { background-color: #ffffff; width: 14px; border-radius: 10px; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(reg => console.log("Service Worker 등록:", reg.scope))
                    .catch(err => console.error("등록 실패:", err));
            });
        }
    </script>

    <h1>Web Game Library</h1>

    <div id="pwa-install-banner" class="hidden">
        <span class="banner-text">📱 앱으로 편하게 설치하기</span>
        <div class="banner-buttons">
            <button id="install-btn">설치</button>
            <button id="close-banner-btn" onclick="dismissBanner()">✕</button>
        </div>
    </div>

    <div id="auto-slider-container">
        <div class="slider-wrapper" id="sliderWrapper">
            <a href="https://woojik01.github.io/web_games/prototype" target="_blank" class="slide">
                <span class="slide-title">⭐️ 웹 베타 버전</span>
                <span class="slide-desc">Shadow</span>
            </a>
        <!--
            <a href="https://woojik01.github.io/web_games/hell_survivor" target="_blank" class="slide">
                <span class="slide-title">🔥 인기 게임</span>
                <span class="slide-desc">미니 탕탕특공대 플레이하기</span>
            </a>
            <a href="https://woojik01.github.io/web_games/omok" target="_blank" class="slide">
                <span class="slide-title">🧠 두뇌 개발</span>
                <span class="slide-desc">친구와 함께 즐기는 오목 한 판!</span>
            </a>
            <a href="https://woojik01.github.io/web_games/cutting_fruits" target="_blank" class="slide">
                <span class="slide-title">🍉 스트레스 해소</span>
                <span class="slide-desc">신나게 과일 자르기 게임</span>
            </a>
        -->
        </div>
        <div class="dots-container" id="dotsContainer"></div>
    </div>

    <input type="text" id="searchBar" placeholder="게임 이름을 검색하세요..." onkeyup="filterGames()">

    <div id="gameContainer"></div>

    <script>
        // 1. 게임 데이터 설정
        const games = [
            { en: "backroom-mini", ko: "미니 백룸" },
            { en: "brick_breaking", ko: "벽돌깨기" },
            { en: "cutting_fruits", ko: "과일 자르기" },
            { en: "hell_survivor", ko: "미니 탕탕특공대" },
            { en: "immortal_wave", ko: "불멸의 웨이브" },
            { en: "pakur-side", ko: "옆으로 파쿠르" },
            { en: "pakur-up", ko: "위로 파쿠르" },
            { en: "receiving_fruits", ko: "과일 받기" },
            { en: "baduk", ko: "바둑" },
            { en: "omok", ko: "오목" }
        ];

        // 2. 정렬
        games.sort((a, b) => a.en.toLowerCase().localeCompare(b.en.toLowerCase()));

        const container = document.getElementById('gameContainer');
        const baseUrl = "https://woojik01.github.io/web_games/";

        // 3. 화면 그리기
        function displayGames() {
            games.forEach(game => {
                const card = document.createElement('a');
                card.href = baseUrl + game.en;
                card.className = 'game-card';
                card.target = "_blank";
                card.innerHTML = `<div>${game.ko}</div>`;
                container.appendChild(card);
            });
        }

        // 4. 검색
        function filterGames() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].innerText.toLowerCase();
                if (title.includes(query)) {
                    cards[i].classList.remove('hidden');
                } else {
                    cards[i].classList.add('hidden');
                }
            }
        }

        displayGames();

        // --- PWA 설치 배너 스크립트 ---
        let deferredPrompt;
        const installBanner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBanner.classList.add('hidden');
        });

        function dismissBanner() {
            installBanner.classList.add('hidden');
        }

        window.addEventListener('appinstalled', (evt) => {
            installBanner.classList.add('hidden');
        });

        // --- 자동 연동 배너 슬라이드 스크립트 ---
        const sliderWrapper = document.getElementById('sliderWrapper');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dotsContainer');
        
        const totalSlides = slides.length;
        let currentSlide = 0;

        // 동적 스타일 및 인디케이터 Dot 생성
        function initSlider() {
            if (totalSlides === 0) return;

            // 1. 전체 슬라이더 래퍼 너비 및 각 슬라이드 너비 비율 자동 연동
            sliderWrapper.style.width = `${totalSlides * 100}%`;
            slides.forEach(slide => {
                slide.style.width = `${100 / totalSlides}%`;
            });

            // 2. 배너가 1개인 경우 점 숨김 처리 및 슬라이드 종료
            if (totalSlides <= 1) {
                dotsContainer.style.display = 'none';
                return;
            }

            // 3. 배너가 2개 이상일 경우 점(Dot) 동적 생성
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('span');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            }

            // 4. 3초마다 자동 슬라이드 실행
            setInterval(nextSlide, 3000);
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            
            // X축 위치 이동 (-0%, -(100/total)%, ...)
            const offset = -currentSlide * (100 / totalSlides);
            sliderWrapper.style.transform = `translateX(${offset}%)`;

            // Dot 활성화 상태 업데이트
            const dots = dotsContainer.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index === currentSlide) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        // 초기 실행
        initSlider();
    </script>
</body>
</html>
